name: Validate

on:
  push: 
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v7"
      - uses: "actions/setup-python@v7"
        with:
          python-version: "3.14"
      - name: Install test tools
        run: python -m pip install -r requirements-test.txt
      - name: Run unit tests
        run: python -m pytest -q
      - name: Run Ruff
        run: ruff check --select E4,E7,E9,F custom_components tests

  validate-hacs:
    runs-on: "ubuntu-latest"
    steps:
      - name: HACS validation
        uses: "hacs/action@main"
        with:
          category: "integration"
